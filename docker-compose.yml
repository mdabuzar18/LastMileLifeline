services:
  postgres:
    image: postgres:16-alpine
    container_name: lastmile-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lastmile_user
      POSTGRES_PASSWORD: lastmile_demo_password
      POSTGRES_DB: lastmile_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastmile_user -d lastmile_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lastmile-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lastmile-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://lastmile_user:lastmile_demo_password@postgres:5432/lastmile_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=demo-insecure-secret-key-lastmile-lifeline-2026
      - ENVIRONMENT=docker-development
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    container_name: lastmile-worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://lastmile_user:lastmile_demo_password@postgres:5432/lastmile_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=demo-insecure-secret-key-lastmile-lifeline-2026
      - ENVIRONMENT=docker-development

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: lastmile-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: lastmile-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.3.3
    container_name: lastmile-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro

volumes:
  postgres_data:
  redis_data:
